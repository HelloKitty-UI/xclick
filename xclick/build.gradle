plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.xclick'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.xclick"
        minSdk 21
        targetSdk 34
        versionCode 19
        versionName "1.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
