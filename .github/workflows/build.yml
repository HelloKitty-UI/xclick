name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build APK
        run: gradle :app:assembleDebug :xclick:assembleDebug --console=plain

      - name: List APK outputs
        run: |
          echo '--- settings.gradle ---'
          cat settings.gradle
          echo '--- all APKs ---'
          find . -name '*.apk' -not -path '*/dist/*' | sort
          echo '--- xclick build dir ---'
          ls -R xclick/build/outputs 2>&1 || echo 'xclick/build/outputs 不存在!'

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/bilibili-volume-fullscreen.apk
          if [ ! -f xclick/build/outputs/apk/debug/app-debug.apk ]; then
            echo '=== xclick APK 缺失，诊断信息如下 ==='
            echo '--- settings.gradle ---'
            cat settings.gradle
            echo '--- xclick 目录下的文件 ---'
            find xclick -type f 2>&1 | sort || echo 'xclick 目录不存在!'
            echo '--- xclick/build 目录 ---'
            ls -R xclick/build 2>&1 || echo 'xclick/build 目录不存在!'
            echo '--- 全部 APK ---'
            find . -name '*.apk' -not -path '*/dist/*' | sort
            exit 1
          fi
          cp xclick/build/outputs/apk/debug/xclick-debug.apk dist/xclick.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
